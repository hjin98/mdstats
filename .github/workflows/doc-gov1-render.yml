name: DOC-GOV1 Governance Check

on:
  push:
    branches:
      - agent/doc-gov1-g0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Rebuild assembled architecture and require clean result
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_mlff_architecture_manual.py
          git diff --exit-code -- docs/arch_manuals/mlff_training_data_architecture.md

      - name: Current authority regression checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '70_status_and_gates.md' tools/build_mlff_architecture_manual.py
          ! grep -Eq '(^|[[:space:]])Next gate|COMPLETE in 0\.20|Status and forward gates' docs/arch_manuals/mlff_training_data_architecture.md
          ! grep -q '^# Stage gates' docs/specs/training_data/mlff_data_stage_plan_spec.md
          ! grep -q 'Canonical plan and current status' docs/specs/training_data/README.md
          ! grep -q '^## Current version history' docs/specs/training_data/README.md
          ! grep -Eq 'dependency/status graph|current status, and forward gates|module/gate contracts' \
            docs/README.md docs/INDEX.md docs/arch_manuals/README.md
          grep -q '^prune workplans$' MANIFEST.in
          test -s workplans/README.md
          test -s workplans/TEMPLATE.md
          test -s docs/history/mlff/manual_snapshots/mlff_training_data_architecture_pre_doc_gov1.md
          test -s docs/history/mlff/manual_snapshots/mlff_training_data_status_and_gates_pre_doc_gov1.md
          test -s docs/history/mlff/manual_snapshots/mlff_data_stage_plan_spec_pre_doc_gov1.md
          test -s docs/history/mlff/manual_snapshots/training_data_spec_index_pre_doc_gov1.md
          test -s docs/history/mlff/manual_snapshots/mlff_training_data_dependency_graph_pre_doc_gov1.json

      - name: Validate dependency graph current-state semantics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/arch_manuals/mlff_training_data_dependency_graph.json')
          g = json.loads(p.read_text())
          assert g.get('authority_model') == 'current_dependency_architecture'
          for k in ('architecture_revision', 'branch', 'documentation_gate', 'next_gate'):
              assert k not in g, k
          bad_types = {'implementation_requires', 'documentation_requires'}
          used = {e['type'] for e in g['edges']}
          assert not (used & bad_types), used & bad_types
          assert used <= set(g['edge_type_definitions']), used - set(g['edge_type_definitions'])
          ids = {n['id'] for n in g['nodes']}
          for e in g['edges']:
              assert e['from'] in ids and e['to'] in ids, e
          for n in g['nodes']:
              for k in ('implementation_status', 'next_gate', 'gate_name'):
                  assert k not in n, (n['id'], k)
          print(f'graph OK: {len(g["nodes"])} nodes, {len(g["edges"])} edges')
          PY

      - name: Verify permanent PDF provenance pairs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for md in (
              Path('docs/arch_manuals/mlff_training_data_architecture.md'),
              Path('docs/specs/training_data/mlff_data_stage_plan_spec.md'),
          ):
              pdf = md.with_suffix('.pdf')
              manifest = Path(str(pdf) + '.manifest.json')
              assert md.is_file() and pdf.is_file() and manifest.is_file(), md
              m = json.loads(manifest.read_text())
              assert hashlib.sha256(md.read_bytes()).hexdigest() == m['source']['sha256'], md
              assert hashlib.sha256(pdf.read_bytes()).hexdigest() == m['pdf']['sha256'], pdf
              assert m['renderer']['policy_version'] == 'pandoc-typst-v2'
              print('provenance OK:', md)
          PY

      - name: Verify migration-base snapshot identity
        shell: bash
        run: |
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_training_data_architecture_pre_doc_gov1.md)" = "37b44aed940d4fc4ee9e86ca0f0587c7c5f2344f"
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_training_data_status_and_gates_pre_doc_gov1.md)" = "39a4d44aaa25ae7838ed40b994e60f775d6af9b5"
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_data_stage_plan_spec_pre_doc_gov1.md)" = "5454698cb5c3859ac5543967074f6ffe69bc03eb"
          test "$(git hash-object docs/history/mlff/manual_snapshots/training_data_spec_index_pre_doc_gov1.md)" = "9bba16bac432e014b086abe4bbfb22d72c04e686"
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_training_data_dependency_graph_pre_doc_gov1.json)" = "2025102638efb943338c224c6c3201e499a8cb20"
