name: DOC-GOV1 Final Qualification

on:
  push:
    branches:
      - agent/doc-gov1-g0
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Repair system-contract table pagination without semantic change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/specs/training_data/mlff_data_stage_plan_spec.md')
          text=p.read_text(encoding='utf-8')
          old='''| Record | Owns | Must not own |
|---|---|---|
| `TrainingDataSource` | source path, hashes, composition, controls, ensemble, quality, label domain | frame eligibility or split role |
| `TrainingFrameRecord` | source-bound frame facts and identity references | eligibility, partition, selection, exposure, acquisition |
| `FrameEligibilityDecision` | post-DFT label/quality outcome | partition or training membership |
| `PartitionAssignment` | one statistical role under one partition policy | feature-selection outcome |
| `PartitionFeasibilityReport` | support for requested roles and declared reductions | fabricated independent cohorts |
| `PartitionIndependenceReport` | evidence grade, purge, correlation, and duplicate limits | claim of stronger independence than observed |
| `SelectionAssignment` | selected/not-selected and reasons | epoch use count |
| `ExposureAssignment` | head, epochs, weights, and use counts | independent-evidence claim |
| `MaceExposureRealizationRecord` | actual loader counts, duplication, batches, and property exposures | intended exposure only |
| `AtomicReferenceFitRecord` | training-domain E0 corrections and residual | held-out labels |
| `TrainingProtocolIdentity` | complete model/data/replay/objective/exposure/checkpoint protocol | mutable runtime observations |
| `ProtocolFreezeRecord` | frozen selected protocol and committee identities | evaluation results |
| `CandidateAdmissibilityDecision` | pre-DFT geometry and trajectory safety | DFT convergence claim |
| `AcquisitionDecision` | calibrated or rank-only acquisition result | post-DFT eligibility |
| `MaterialProfileIdentity` | user-declared phases, geometry, chemistry modifiers, and optional extensions | structural feature values or automatic classification claims |
| `AtomGroupCatalog` | immutable group selectors and phase linkage | per-frame group membership arrays unless owned by a provider artifact |
| `ConditionAxisCatalog` | axes whose coverage may matter | observed coverage or partition assignment |
| `IndependenceAxisCatalog` | candidate sources of independent evidence | proof that independent realizations exist |
| `MaterialProfileContracts` | digest-bound aggregate of the four declarative profile families | physical features, events, or validation results |
'''
          new='''| Record | Owns | Must not own |
|---|---|---|
| `TrainingDataSource` | source path, hashes, composition, controls, ensemble, quality, label domain | frame eligibility or split role |
| `TrainingFrameRecord` | source-bound frame facts and identity references | eligibility, partition, selection, exposure, acquisition |
| `FrameEligibilityDecision` | post-DFT label/quality outcome | partition or training membership |
| `PartitionAssignment` | one statistical role under one partition policy | feature-selection outcome |
| `PartitionFeasibilityReport` | support for requested roles and declared reductions | fabricated independent cohorts |
| `PartitionIndependenceReport` | evidence grade, purge, correlation, and duplicate limits | claim of stronger independence than observed |
| `SelectionAssignment` | selected/not-selected and reasons | epoch use count |
| `ExposureAssignment` | head, epochs, weights, and use counts | independent-evidence claim |
| `MaceExposureRealizationRecord` | actual loader counts, duplication, batches, and property exposures | intended exposure only |

The fitted/protocol/profile record families continue the same ownership contract:

| Record | Owns | Must not own |
|---|---|---|
| `AtomicReferenceFitRecord` | training-domain E0 corrections and residual | held-out labels |
| `TrainingProtocolIdentity` | complete model/data/replay/objective/exposure/checkpoint protocol | mutable runtime observations |
| `ProtocolFreezeRecord` | frozen selected protocol and committee identities | evaluation results |
| `CandidateAdmissibilityDecision` | pre-DFT geometry and trajectory safety | DFT convergence claim |
| `AcquisitionDecision` | calibrated or rank-only acquisition result | post-DFT eligibility |
| `MaterialProfileIdentity` | user-declared phases, geometry, chemistry modifiers, and optional extensions | structural feature values or automatic classification claims |
| `AtomGroupCatalog` | immutable group selectors and phase linkage | per-frame group membership arrays unless owned by a provider artifact |
| `ConditionAxisCatalog` | axes whose coverage may matter | observed coverage or partition assignment |
| `IndependenceAxisCatalog` | candidate sources of independent evidence | proof that independent realizations exist |
| `MaterialProfileContracts` | digest-bound aggregate of the four declarative profile families | physical features, events, or validation results |
'''
          if old in text:
              p.write_text(text.replace(old,new,1), encoding='utf-8')
              print('split oversized record-family table')
          elif 'The fitted/protocol/profile record families continue the same ownership contract:' in text:
              print('pagination repair already present')
          else:
              raise SystemExit('record-family table shape changed unexpectedly')
          PY

      - name: Install Pandoc 3.10.2
        uses: pandoc/actions/setup@v1
        with:
          version: 3.10.2

      - name: Install and verify Typst 0.15.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz' | sha256sum -c -
          tar -C /tmp -xf /tmp/typst.tar.xz
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Synchronize repaired system-contract PDF and provenance
        shell: bash
        run: |
          set -euo pipefail
          src=docs/specs/training_data/mlff_data_stage_plan_spec.md
          pdf=docs/specs/training_data/mlff_data_stage_plan_spec.pdf
          pandoc "$src" --from=markdown --pdf-engine=typst --metadata=lang:en-US \
            -V papersize:us-letter -V fontsize:10.5pt -V geometry:margin=0.75in \
            --resource-path="$(dirname "$src")" -o "$pdf"
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          src=pathlib.Path('docs/specs/training_data/mlff_data_stage_plan_spec.md')
          pdf=src.with_suffix('.pdf')
          mf=pathlib.Path(str(pdf)+'.manifest.json')
          config={
              'absolute_images':'reject','fontsize':'10.5pt','from':'markdown','lang':'en-US',
              'margin':'0.75in','papersize':'us-letter','pdf_engine':'typst','remote_images':'reject',
              'resource_path':'source-parent','resource_provenance':'pandoc-image-ast-local-files-v1',
          }
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          cfg=hashlib.sha256(json.dumps(config,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          obj={
              'schema_version':1,
              'source':{'name':src.name,'sha256':sha(src)},
              'pdf':{'name':pdf.name,'sha256':sha(pdf)},
              'renderer':{
                  'driver':'DOC-GOV1 GitHub Actions equivalent of render_markdown_pdfs.py',
                  'policy_version':'pandoc-typst-v2',
                  'pandoc_version':subprocess.check_output(['pandoc','--version'],text=True).splitlines()[0],
                  'typst_version':subprocess.check_output(['typst','--version'],text=True).strip(),
                  'config':config,'config_sha256':cfg,
              },
              'resources':[],
          }
          mf.write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$src" "$pdf" "$pdf.manifest.json"
          if ! git diff --cached --quiet; then
            git commit -m 'DOC-GOV1 G7 fix system-contract PDF pagination [skip ci]'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi

      - name: Governance and deterministic assembly checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_mlff_architecture_manual.py
          git diff --exit-code -- docs/arch_manuals/mlff_training_data_architecture.md
          ! grep -q '70_status_and_gates.md' tools/build_mlff_architecture_manual.py
          ! grep -Eq '(^|[[:space:]])Next gate|COMPLETE in 0\.20|Status and forward gates' docs/arch_manuals/mlff_training_data_architecture.md
          ! grep -q '^# Stage gates' docs/specs/training_data/mlff_data_stage_plan_spec.md
          ! grep -q 'Canonical plan and current status' docs/specs/training_data/README.md
          ! grep -Eq 'dependency/status graph|current status, and forward gates|module/gate contracts' docs/README.md docs/INDEX.md docs/arch_manuals/README.md
          grep -q '^prune workplans$' MANIFEST.in
          test ! -e tools/doc_gov1_g3_migrate.py
          test ! -e tools/doc_gov1_g4_migrate.py

      - name: Validate dependency graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('docs/arch_manuals/mlff_training_data_dependency_graph.json').read_text())
          assert g.get('authority_model') == 'current_dependency_architecture'
          for k in ('architecture_revision','branch','documentation_gate','next_gate'):
              assert k not in g
          used={e['type'] for e in g['edges']}
          assert not (used & {'implementation_requires','documentation_requires'})
          assert used <= set(g['edge_type_definitions'])
          ids={n['id'] for n in g['nodes']}
          assert all(e['from'] in ids and e['to'] in ids for e in g['edges'])
          assert all(all(k not in n for k in ('implementation_status','next_gate','gate_name')) for n in g['nodes'])
          print(f'graph OK: {len(g["nodes"])} nodes, {len(g["edges"])} edges')
          PY

      - name: Re-render permanent MLFF PDFs and compare rendered content
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          i=0
          for src in \
            docs/arch_manuals/mlff_training_data_architecture.md \
            docs/specs/training_data/mlff_data_stage_plan_spec.md
          do
            i=$((i+1))
            tracked="${src%.md}.pdf"
            rerender="/tmp/docgov1-rerender-${i}.pdf"
            pandoc "$src" --from=markdown --pdf-engine=typst --metadata=lang:en-US \
              -V papersize:us-letter -V fontsize:10.5pt -V geometry:margin=0.75in \
              --resource-path="$(dirname "$src")" -o "$rerender"
            tracked_pages=$(pdfinfo "$tracked" | awk '/^Pages:/ {print $2}')
            rerender_pages=$(pdfinfo "$rerender" | awk '/^Pages:/ {print $2}')
            test "$tracked_pages" = "$rerender_pages"
            pdftotext -layout "$tracked" "/tmp/docgov1-tracked-${i}.txt"
            pdftotext -layout "$rerender" "/tmp/docgov1-rerender-${i}.txt"
            cmp "/tmp/docgov1-tracked-${i}.txt" "/tmp/docgov1-rerender-${i}.txt"
            echo "rendered-content OK: $src ($tracked_pages pages)"
          done

      - name: Verify permanent PDF provenance manifests
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for md in (
              Path('docs/arch_manuals/mlff_training_data_architecture.md'),
              Path('docs/specs/training_data/mlff_data_stage_plan_spec.md'),
          ):
              pdf=md.with_suffix('.pdf')
              mf=Path(str(pdf)+'.manifest.json')
              m=json.loads(mf.read_text())
              assert hashlib.sha256(md.read_bytes()).hexdigest() == m['source']['sha256'], md
              assert hashlib.sha256(pdf.read_bytes()).hexdigest() == m['pdf']['sha256'], pdf
              assert m['renderer']['policy_version'] == 'pandoc-typst-v2'
              assert m['renderer']['pandoc_version'] == 'pandoc 3.10.2'
              assert m['renderer']['typst_version'].startswith('typst 0.15.1')
              print('provenance OK:', md)
          PY

      - name: Build sdist and wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          rm -rf dist build
          python -m build --sdist --wheel
          ls -lh dist/

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          sdists=list(Path('dist').glob('*.tar.gz'))
          wheels=list(Path('dist').glob('*.whl'))
          assert len(sdists)==1, sdists
          assert len(wheels)==1, wheels
          with tarfile.open(sdists[0], 'r:gz') as tf: names=tf.getnames()
          with zipfile.ZipFile(wheels[0]) as zf: wnames=zf.namelist()
          assert not any('/workplans/' in '/'+n.strip('/')+'/' for n in names), 'workplans leaked into sdist'
          assert not any('/workplans/' in '/'+n.strip('/')+'/' for n in wnames), 'workplans leaked into wheel'
          assert not any(n.endswith('/tools/doc_gov1_g3_migrate.py') or n.endswith('/tools/doc_gov1_g4_migrate.py') for n in names), 'migration helper leaked into sdist'
          required=['docs/README.md','docs/INDEX.md','docs/arch_manuals/mlff_training_data_architecture.md','docs/arch_manuals/mlff_training_data_architecture.pdf','docs/arch_manuals/mlff_training_data_architecture.pdf.manifest.json','docs/arch_manuals/mlff_training_data_dependency_graph.json','docs/specs/training_data/README.md','docs/specs/training_data/mlff_data_stage_plan_spec.md','docs/specs/training_data/mlff_data_stage_plan_spec.pdf','docs/specs/training_data/mlff_data_stage_plan_spec.pdf.manifest.json','docs/history/mlff/README.md']
          for rel in required: assert any(n.endswith('/'+rel) for n in names), f'missing from sdist: {rel}'
          assert any(n.startswith('mdstats/') for n in wnames)
          assert not any(n.startswith('docs/') or '/docs/' in n for n in wnames), 'unexpected repository docs in wheel'
          print('sdist:',sdists[0].name,'members=',len(names))
          print('wheel:',wheels[0].name,'members=',len(wnames))
          print('distribution contents OK')
          PY

      - name: Install wheel outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/docgov1-venv
          python -m venv /tmp/docgov1-venv
          /tmp/docgov1-venv/bin/python -m pip install --upgrade pip
          /tmp/docgov1-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/docgov1-venv/bin/python - <<'PY'
          import importlib.metadata, pathlib, mdstats
          version=importlib.metadata.version('mdstats')
          location=pathlib.Path(mdstats.__file__).resolve()
          assert version == '0.20.241a0', version
          assert '/tmp/docgov1-venv/' in str(location), location
          print('installed version:',version)
          print('installed module:',location)
          PY
          /tmp/docgov1-venv/bin/python -m pip check

      - name: Final repository cleanliness and snapshot checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_training_data_architecture_pre_doc_gov1.md)" = "37b44aed940d4fc4ee9e86ca0f0587c7c5f2344f"
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_training_data_status_and_gates_pre_doc_gov1.md)" = "39a4d44aaa25ae7838ed40b994e60f775d6af9b5"
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_data_stage_plan_spec_pre_doc_gov1.md)" = "5454698cb5c3859ac5543967074f6ffe69bc03eb"
          test "$(git hash-object docs/history/mlff/manual_snapshots/training_data_spec_index_pre_doc_gov1.md)" = "9bba16bac432e014b086abe4bbfb22d72c04e686"
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_training_data_dependency_graph_pre_doc_gov1.json)" = "2025102638efb943338c224c6c3201e499a8cb20"

      - uses: actions/upload-artifact@v4
        with:
          name: doc-gov1-final-qualification
          path: |
            docs/arch_manuals/mlff_training_data_architecture.pdf
            docs/arch_manuals/mlff_training_data_architecture.pdf.manifest.json
            docs/specs/training_data/mlff_data_stage_plan_spec.pdf
            docs/specs/training_data/mlff_data_stage_plan_spec.pdf.manifest.json
            dist/*
          if-no-files-found: error
