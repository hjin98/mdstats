name: DOC-GOV1 Final Qualification

on:
  push:
    branches:
      - agent/doc-gov1-g0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Governance and deterministic assembly checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_mlff_architecture_manual.py
          git diff --exit-code -- docs/arch_manuals/mlff_training_data_architecture.md
          ! grep -q '70_status_and_gates.md' tools/build_mlff_architecture_manual.py
          ! grep -Eq '(^|[[:space:]])Next gate|COMPLETE in 0\.20|Status and forward gates' docs/arch_manuals/mlff_training_data_architecture.md
          ! grep -q '^# Stage gates' docs/specs/training_data/mlff_data_stage_plan_spec.md
          ! grep -q 'Canonical plan and current status' docs/specs/training_data/README.md
          ! grep -Eq 'dependency/status graph|current status, and forward gates|module/gate contracts' docs/README.md docs/INDEX.md docs/arch_manuals/README.md
          grep -q '^prune workplans$' MANIFEST.in
          test ! -e tools/doc_gov1_g3_migrate.py
          test ! -e tools/doc_gov1_g4_migrate.py

      - name: Validate dependency graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('docs/arch_manuals/mlff_training_data_dependency_graph.json').read_text())
          assert g.get('authority_model') == 'current_dependency_architecture'
          for k in ('architecture_revision','branch','documentation_gate','next_gate'):
              assert k not in g
          used={e['type'] for e in g['edges']}
          assert not (used & {'implementation_requires','documentation_requires'})
          assert used <= set(g['edge_type_definitions'])
          ids={n['id'] for n in g['nodes']}
          assert all(e['from'] in ids and e['to'] in ids for e in g['edges'])
          assert all(all(k not in n for k in ('implementation_status','next_gate','gate_name')) for n in g['nodes'])
          print(f'graph OK: {len(g["nodes"])} nodes, {len(g["edges"])} edges')
          PY

      - name: Install Pandoc 3.10.2
        uses: pandoc/actions/setup@v1
        with:
          version: 3.10.2

      - name: Install and verify Typst 0.15.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz' | sha256sum -c -
          tar -C /tmp -xf /tmp/typst.tar.xz
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Re-render permanent MLFF PDFs and require byte-stable tracked artifacts
        shell: bash
        run: |
          set -euo pipefail
          for src in \
            docs/arch_manuals/mlff_training_data_architecture.md \
            docs/specs/training_data/mlff_data_stage_plan_spec.md
          do
            pdf="${src%.md}.pdf"
            pandoc "$src" --from=markdown --pdf-engine=typst --metadata=lang:en-US \
              -V papersize:us-letter -V fontsize:10.5pt -V geometry:margin=0.75in \
              --resource-path="$(dirname "$src")" -o "$pdf"
          done
          git diff --exit-code -- \
            docs/arch_manuals/mlff_training_data_architecture.md \
            docs/arch_manuals/mlff_training_data_architecture.pdf \
            docs/specs/training_data/mlff_data_stage_plan_spec.md \
            docs/specs/training_data/mlff_data_stage_plan_spec.pdf

      - name: Verify permanent PDF provenance manifests
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for md in (
              Path('docs/arch_manuals/mlff_training_data_architecture.md'),
              Path('docs/specs/training_data/mlff_data_stage_plan_spec.md'),
          ):
              pdf=md.with_suffix('.pdf')
              mf=Path(str(pdf)+'.manifest.json')
              m=json.loads(mf.read_text())
              assert hashlib.sha256(md.read_bytes()).hexdigest() == m['source']['sha256'], md
              assert hashlib.sha256(pdf.read_bytes()).hexdigest() == m['pdf']['sha256'], pdf
              assert m['renderer']['policy_version'] == 'pandoc-typst-v2'
              assert m['renderer']['pandoc_version'] == 'pandoc 3.10.2'
              assert m['renderer']['typst_version'].startswith('typst 0.15.1')
              print('provenance OK:', md)
          PY

      - name: Build sdist and wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --sdist --wheel
          ls -lh dist/

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          sdists=list(Path('dist').glob('*.tar.gz'))
          wheels=list(Path('dist').glob('*.whl'))
          assert len(sdists)==1, sdists
          assert len(wheels)==1, wheels
          with tarfile.open(sdists[0], 'r:gz') as tf:
              names=tf.getnames()
          with zipfile.ZipFile(wheels[0]) as zf:
              wnames=zf.namelist()
          assert not any('/workplans/' in '/'+n.strip('/')+'/' for n in names), 'workplans leaked into sdist'
          assert not any('/workplans/' in '/'+n.strip('/')+'/' for n in wnames), 'workplans leaked into wheel'
          assert not any(n.endswith('/tools/doc_gov1_g3_migrate.py') or n.endswith('/tools/doc_gov1_g4_migrate.py') for n in names), 'migration helper leaked into sdist'
          required=[
              'docs/README.md',
              'docs/INDEX.md',
              'docs/arch_manuals/mlff_training_data_architecture.md',
              'docs/arch_manuals/mlff_training_data_architecture.pdf',
              'docs/arch_manuals/mlff_training_data_architecture.pdf.manifest.json',
              'docs/arch_manuals/mlff_training_data_dependency_graph.json',
              'docs/specs/training_data/README.md',
              'docs/specs/training_data/mlff_data_stage_plan_spec.md',
              'docs/specs/training_data/mlff_data_stage_plan_spec.pdf',
              'docs/specs/training_data/mlff_data_stage_plan_spec.pdf.manifest.json',
              'docs/history/mlff/README.md',
          ]
          for rel in required:
              assert any(n.endswith('/'+rel) for n in names), f'missing from sdist: {rel}'
          # The wheel intentionally contains only the Python package and package data under pyproject.toml.
          assert any(n.startswith('mdstats/') for n in wnames)
          assert not any(n.startswith('docs/') or '/docs/' in n for n in wnames), 'unexpected repository docs in wheel'
          print('sdist:', sdists[0].name, 'members=', len(names))
          print('wheel:', wheels[0].name, 'members=', len(wnames))
          print('distribution contents OK')
          PY

      - name: Install wheel outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/docgov1-venv
          /tmp/docgov1-venv/bin/python -m pip install --upgrade pip
          /tmp/docgov1-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/docgov1-venv/bin/python - <<'PY'
          import importlib.metadata, pathlib, mdstats
          version=importlib.metadata.version('mdstats')
          location=pathlib.Path(mdstats.__file__).resolve()
          assert version == '0.20.241a0', version
          assert '/tmp/docgov1-venv/' in str(location), location
          print('installed version:', version)
          print('installed module:', location)
          PY
          /tmp/docgov1-venv/bin/python -m pip check

      - name: Final repository cleanliness and snapshot checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_training_data_architecture_pre_doc_gov1.md)" = "37b44aed940d4fc4ee9e86ca0f0587c7c5f2344f"
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_training_data_status_and_gates_pre_doc_gov1.md)" = "39a4d44aaa25ae7838ed40b994e60f775d6af9b5"
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_data_stage_plan_spec_pre_doc_gov1.md)" = "5454698cb5c3859ac5543967074f6ffe69bc03eb"
          test "$(git hash-object docs/history/mlff/manual_snapshots/training_data_spec_index_pre_doc_gov1.md)" = "9bba16bac432e014b086abe4bbfb22d72c04e686"
          test "$(git hash-object docs/history/mlff/manual_snapshots/mlff_training_data_dependency_graph_pre_doc_gov1.json)" = "2025102638efb943338c224c6c3201e499a8cb20"

      - uses: actions/upload-artifact@v4
        with:
          name: doc-gov1-final-qualification
          path: |
            docs/arch_manuals/mlff_training_data_architecture.pdf
            docs/arch_manuals/mlff_training_data_architecture.pdf.manifest.json
            docs/specs/training_data/mlff_data_stage_plan_spec.pdf
            docs/specs/training_data/mlff_data_stage_plan_spec.pdf.manifest.json
            dist/*
          if-no-files-found: error
