name: DOC-GOV1 Render

on:
  push:
    branches:
      - agent/doc-gov1-g0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc 3.10.2
        uses: pandoc/actions/setup@v1
        with:
          version: 3.10.2

      - name: Install Typst 0.15.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz' | sha256sum -c -
          tar -C /tmp -xf /tmp/typst.tar.xz
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Rebuild assembled architecture
        run: python tools/build_mlff_architecture_manual.py

      - name: Render architecture PDF
        shell: bash
        run: |
          set -euo pipefail
          src=docs/arch_manuals/mlff_training_data_architecture.md
          pdf=docs/arch_manuals/mlff_training_data_architecture.pdf
          pandoc "$src" \
            --from=markdown \
            --pdf-engine=typst \
            --metadata=lang:en-US \
            -V papersize:us-letter \
            -V fontsize:10.5pt \
            -V geometry:margin=0.75in \
            --resource-path="$(dirname "$src")" \
            -o "$pdf"

      - name: Write provenance manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          src = pathlib.Path('docs/arch_manuals/mlff_training_data_architecture.md')
          pdf = pathlib.Path('docs/arch_manuals/mlff_training_data_architecture.pdf')
          manifest = pathlib.Path(str(pdf) + '.manifest.json')
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          config = {
              'absolute_images': 'reject',
              'fontsize': '10.5pt',
              'from': 'markdown',
              'lang': 'en-US',
              'margin': '0.75in',
              'papersize': 'us-letter',
              'pdf_engine': 'typst',
              'remote_images': 'reject',
              'resource_path': 'source-parent',
              'resource_provenance': 'pandoc-image-ast-local-files-v1',
          }
          cfg_json = json.dumps(config, sort_keys=True, separators=(',', ':')).encode()
          obj = {
              'schema_version': 1,
              'source': {'name': src.name, 'sha256': sha256(src)},
              'pdf': {'name': pdf.name, 'sha256': sha256(pdf)},
              'renderer': {
                  'driver': 'DOC-GOV1 GitHub Actions equivalent of render_markdown_pdfs.py',
                  'policy_version': 'pandoc-typst-v2',
                  'pandoc_version': subprocess.check_output(['pandoc', '--version'], text=True).splitlines()[0],
                  'typst_version': subprocess.check_output(['typst', '--version'], text=True).strip(),
                  'config': config,
                  'config_sha256': hashlib.sha256(cfg_json).hexdigest(),
              },
              'resources': [],
          }
          manifest.write_text(json.dumps(obj, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Verify PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/arch_manuals/mlff_training_data_architecture.pdf
          test -s docs/arch_manuals/mlff_training_data_architecture.pdf.manifest.json
          python - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path('docs/arch_manuals/mlff_training_data_architecture.pdf')
          m = json.loads(pathlib.Path(str(p)+'.manifest.json').read_text())
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          assert h == m['pdf']['sha256']
          s = pathlib.Path('docs/arch_manuals/mlff_training_data_architecture.md')
          assert hashlib.sha256(s.read_bytes()).hexdigest() == m['source']['sha256']
          print('provenance OK')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doc-gov1-render
          path: |
            docs/arch_manuals/mlff_training_data_architecture.md
            docs/arch_manuals/mlff_training_data_architecture.pdf
            docs/arch_manuals/mlff_training_data_architecture.pdf.manifest.json
          if-no-files-found: error
