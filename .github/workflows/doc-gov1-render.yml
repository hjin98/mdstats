name: DOC-GOV1 Render

on:
  push:
    branches:
      - agent/doc-gov1-g0
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply lossless G3 specification split
        run: python tools/doc_gov1_g3_migrate.py

      - name: Install Pandoc 3.10.2
        uses: pandoc/actions/setup@v1
        with:
          version: 3.10.2

      - name: Install Typst 0.15.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz' | sha256sum -c -
          tar -C /tmp -xf /tmp/typst.tar.xz
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Rebuild assembled architecture
        run: python tools/build_mlff_architecture_manual.py

      - name: Render permanent Markdown PDFs
        shell: bash
        run: |
          set -euo pipefail
          for src in \
            docs/arch_manuals/mlff_training_data_architecture.md \
            docs/specs/training_data/mlff_data_stage_plan_spec.md
          do
            pdf="${src%.md}.pdf"
            pandoc "$src" --from=markdown --pdf-engine=typst --metadata=lang:en-US \
              -V papersize:us-letter -V fontsize:10.5pt -V geometry:margin=0.75in \
              --resource-path="$(dirname "$src")" -o "$pdf"
          done

      - name: Write and verify provenance manifests
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          sources = [
              pathlib.Path('docs/arch_manuals/mlff_training_data_architecture.md'),
              pathlib.Path('docs/specs/training_data/mlff_data_stage_plan_spec.md'),
          ]
          config = {
              'absolute_images': 'reject', 'fontsize': '10.5pt', 'from': 'markdown',
              'lang': 'en-US', 'margin': '0.75in', 'papersize': 'us-letter',
              'pdf_engine': 'typst', 'remote_images': 'reject',
              'resource_path': 'source-parent',
              'resource_provenance': 'pandoc-image-ast-local-files-v1',
          }
          def sha256(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          cfg = hashlib.sha256(json.dumps(config, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          for src in sources:
              pdf = src.with_suffix('.pdf')
              manifest = pathlib.Path(str(pdf) + '.manifest.json')
              obj = {
                  'schema_version': 1,
                  'source': {'name': src.name, 'sha256': sha256(src)},
                  'pdf': {'name': pdf.name, 'sha256': sha256(pdf)},
                  'renderer': {
                      'driver': 'DOC-GOV1 GitHub Actions equivalent of render_markdown_pdfs.py',
                      'policy_version': 'pandoc-typst-v2',
                      'pandoc_version': subprocess.check_output(['pandoc','--version'], text=True).splitlines()[0],
                      'typst_version': subprocess.check_output(['typst','--version'], text=True).strip(),
                      'config': config, 'config_sha256': cfg,
                  },
                  'resources': [],
              }
              manifest.write_text(json.dumps(obj, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              assert sha256(src) == obj['source']['sha256']
              assert sha256(pdf) == obj['pdf']['sha256']
              print('provenance OK:', src)
          PY

      - name: G3 authority checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '^# Stage gates' docs/specs/training_data/mlff_data_stage_plan_spec.md
          ! grep -q 'Canonical plan and current status' docs/specs/training_data/README.md
          ! grep -q '^## Current version history' docs/specs/training_data/README.md
          test -s docs/history/mlff/manual_snapshots/mlff_data_stage_plan_spec_pre_doc_gov1.md
          test -s docs/history/mlff/manual_snapshots/training_data_spec_index_pre_doc_gov1.md

      - name: Commit qualified G3 state to branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arch_manuals/mlff_training_data_architecture.md \
                  docs/arch_manuals/mlff_training_data_architecture.pdf \
                  docs/arch_manuals/mlff_training_data_architecture.pdf.manifest.json \
                  docs/specs/training_data/README.md \
                  docs/specs/training_data/mlff_data_stage_plan_spec.md \
                  docs/specs/training_data/mlff_data_stage_plan_spec.pdf \
                  docs/specs/training_data/mlff_data_stage_plan_spec.pdf.manifest.json \
                  docs/history/mlff/manual_snapshots/mlff_data_stage_plan_spec_pre_doc_gov1.md \
                  docs/history/mlff/manual_snapshots/training_data_spec_index_pre_doc_gov1.md
          if git diff --cached --quiet; then
            echo 'G3 state already synchronized'
          else
            git commit -m 'DOC-GOV1 G3 normalize MLFF specifications [skip ci]'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: doc-gov1-render
          path: |
            docs/arch_manuals/mlff_training_data_architecture.md
            docs/arch_manuals/mlff_training_data_architecture.pdf
            docs/arch_manuals/mlff_training_data_architecture.pdf.manifest.json
            docs/specs/training_data/mlff_data_stage_plan_spec.md
            docs/specs/training_data/mlff_data_stage_plan_spec.pdf
            docs/specs/training_data/mlff_data_stage_plan_spec.pdf.manifest.json
          if-no-files-found: error
