name: Temporary native build validation

on:
  push:
    branches:
      - feat/mvsel2-forward-lazy

permissions:
  contents: read

jobs:
  validate-native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel build pytest

      - name: Strict clean mdstats build
        run: python tools/mdstats-build.py

      - name: Qualify native MVSEL2 backend
        run: |
          python - <<'PY'
          from mdstats.training_data.mvsel2_native_backend import qualify_mvsel2_native_backend_v2
          status = qualify_mvsel2_native_backend_v2()
          print(status)
          assert status.available
          assert status.qualified
          assert status.openmp
          PY

      - name: Focused BUILD1 and native regressions
        run: python -m pytest -q tests/test_native_build_registry.py tests/test_mlff_mvsel2_native_backend.py

      - name: Build source distribution
        run: python -m build --sdist --outdir dist-validation

      - name: Verify native sources in source distribution
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archives = list(Path('dist-validation').glob('*.tar.gz'))
          assert len(archives) == 1, archives
          with tarfile.open(archives[0], 'r:gz') as tf:
              names = tf.getnames()
          required_suffixes = (
              '/build_support/native_extensions.py',
              '/mdstats/_mvsel2_native.c',
          )
          for suffix in required_suffixes:
              matches = [name for name in names if name.endswith(suffix)]
              print(suffix, matches)
              assert matches, f'missing from sdist: {suffix}'
          PY
