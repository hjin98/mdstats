name: DOC-GOV1 G7 Layout Repair

on:
  push:
    branches:
      - agent/doc-gov1-g0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/doc-gov1-g0
          fetch-depth: 0

      - name: Split oversized record-family table
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/specs/training_data/mlff_data_stage_plan_spec.md')
          lines = p.read_text(encoding='utf-8').splitlines()
          marker = 'The fitted/protocol/profile record families continue the same ownership contract:'
          if marker not in lines:
              split = next(i for i, line in enumerate(lines) if line.startswith('| `AtomicReferenceFitRecord` |'))
              insertion = [
                  '',
                  marker,
                  '',
                  '| Record | Owns | Must not own |',
                  '|---|---|---|',
              ]
              lines[split:split] = insertion
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print('record-family table split for page-safe rendering')
          else:
              print('record-family table already split')
          PY

      - name: Install Pandoc 3.10.2
        uses: pandoc/actions/setup@v1
        with:
          version: 3.10.2

      - name: Install verified Typst 0.15.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz' | sha256sum -c -
          tar -C /tmp -xf /tmp/typst.tar.xz
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: Render system-contract PDF and provenance
        shell: bash
        run: |
          set -euo pipefail
          src=docs/specs/training_data/mlff_data_stage_plan_spec.md
          pdf=docs/specs/training_data/mlff_data_stage_plan_spec.pdf
          pandoc "$src" --from=markdown --pdf-engine=typst --metadata=lang:en-US -V papersize:us-letter -V fontsize:10.5pt -V geometry:margin=0.75in --resource-path="$(dirname "$src")" -o "$pdf"
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          src = pathlib.Path('docs/specs/training_data/mlff_data_stage_plan_spec.md')
          pdf = src.with_suffix('.pdf')
          mf = pathlib.Path(str(pdf) + '.manifest.json')
          config = {
              'absolute_images':'reject','fontsize':'10.5pt','from':'markdown','lang':'en-US',
              'margin':'0.75in','papersize':'us-letter','pdf_engine':'typst','remote_images':'reject',
              'resource_path':'source-parent','resource_provenance':'pandoc-image-ast-local-files-v1',
          }
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          cfg = hashlib.sha256(json.dumps(config, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          obj = {
              'schema_version':1,
              'source':{'name':src.name,'sha256':digest(src)},
              'pdf':{'name':pdf.name,'sha256':digest(pdf)},
              'renderer':{
                  'driver':'DOC-GOV1 GitHub Actions equivalent of render_markdown_pdfs.py',
                  'policy_version':'pandoc-typst-v2',
                  'pandoc_version':subprocess.check_output(['pandoc','--version'], text=True).splitlines()[0],
                  'typst_version':subprocess.check_output(['typst','--version'], text=True).strip(),
                  'config':config,'config_sha256':cfg,
              },
              'resources':[],
          }
          mf.write_text(json.dumps(obj, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit repaired permanent artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/specs/training_data/mlff_data_stage_plan_spec.md docs/specs/training_data/mlff_data_stage_plan_spec.pdf docs/specs/training_data/mlff_data_stage_plan_spec.pdf.manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'DOC-GOV1 G7 fix system-contract PDF pagination [skip ci]'
            git push origin HEAD:agent/doc-gov1-g0
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: doc-gov1-g7-layout-repair
          path: |
            docs/specs/training_data/mlff_data_stage_plan_spec.md
            docs/specs/training_data/mlff_data_stage_plan_spec.pdf
            docs/specs/training_data/mlff_data_stage_plan_spec.pdf.manifest.json
