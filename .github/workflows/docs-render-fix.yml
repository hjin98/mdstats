name: Apply documentation renderer fix

on:
  push:
    branches:
      - ci/incremental-doc-pdf-autosync
    paths:
      - '.github/workflows/docs-render-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply renderer fix and focused regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          builder = Path('docs/build_pdfs.py')
          text = builder.read_text()
          old = '''def _renderer_args(config: dict, source: Path, output: Path) -> list[str]:
              r = config["renderer"]
              return [
                  "pandoc", str(source), "-o", str(output),
                  "--from", r["from"], "--pdf-engine", r["pdf_engine"],
                  "--resource-path", os.pathsep.join((str(source.parent), str(ROOT / "docs"), str(ROOT))),
                  "-V", f"papersize:{r['papersize']}", "-V", f"margin:{r['margin']}",
              ]
          '''
          new = '''def _renderer_args(config: dict, source: Path, output: Path) -> list[str]:
              r = config["renderer"]
              args = [
                  "pandoc", str(source), "-o", str(output),
                  "--from", r["from"], "--pdf-engine", r["pdf_engine"],
                  "--resource-path", os.pathsep.join((str(source.parent), str(ROOT / "docs"), str(ROOT))),
                  "-V", f"papersize:{r['papersize']}",
              ]
              margin = r.get("margin")
              if margin:
                  metadata = output.with_name(output.name + ".metadata.json")
                  metadata.write_text(
                      json.dumps({"margin": {"x": margin, "y": margin}}),
                      encoding="utf-8",
                  )
                  args.extend(("--metadata-file", str(metadata)))
              return args
          '''
          if old not in text:
              raise SystemExit('expected _renderer_args block not found')
          builder.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_docs_pdf_builder.py')
          text = tests.read_text()
          marker = '''    def test_fingerprint_ignores_unrelated_code_but_tracks_source(self):
          '''
          addition = '''    def test_renderer_uses_typed_typst_margin_metadata(self):
              (self.repo / "docs/a.md").write_text("# changed\\n")
              self._commit("source")
              bindir = self.repo / "bin"; bindir.mkdir()
              fake = bindir / "pandoc"
              fake.write_text("""#!/bin/sh
          set -eu
          : \"${CAPTURE_ARGS:?}\"
          : \"${CAPTURE_META:?}\"
          : > \"$CAPTURE_ARGS\"
          out=
          while [ \"$#\" -gt 0 ]; do
            printf '%s\\n' \"$1\" >> \"$CAPTURE_ARGS\"
            case \"$1\" in
              -o)
                out=\"$2\"
                printf '%s\\n' \"$2\" >> \"$CAPTURE_ARGS\"
                shift 2
                ;;
              --metadata-file)
                cp \"$2\" \"$CAPTURE_META\"
                printf '%s\\n' \"$2\" >> \"$CAPTURE_ARGS\"
                shift 2
                ;;
              *) shift ;;
            esac
          done
          test -n \"$out\"
          printf '%%PDF-1.7\\n' > \"$out\"
          """)
              fake.chmod(0o755)
              args_capture = self.repo / "pandoc-args.txt"
              meta_capture = self.repo / "pandoc-meta.json"
              env = os.environ.copy()
              env["PATH"] = f"{bindir}:{env['PATH']}"
              env["CAPTURE_ARGS"] = str(args_capture)
              env["CAPTURE_META"] = str(meta_capture)
              run(self.repo, "python3", "docs/build_pdfs.py", "build",
                  "--changed-path", "docs/a.md", env=env)
              args = args_capture.read_text().splitlines()
              self.assertNotIn("margin:0.75in", args)
              self.assertIn("papersize:us-letter", args)
              self.assertIn("--metadata-file", args)
              self.assertEqual(
                  json.loads(meta_capture.read_text()),
                  {"margin": {"x": "0.75in", "y": "0.75in"}},
              )

          '''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          tests.write_text(text.replace(marker, addition + marker, 1))
          PY

          rm -f \
            .github/workflows/docs-render-diagnostic.yml \
            .github/workflows/docs-render-arg-diagnostic.yml \
            .github/workflows/docs-render-pagevar-diagnostic.yml \
            .github/workflows/docs-render-fix.yml

          python3 -m unittest -v tests.test_docs_pdf_builder
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: encode Typst margin as structured metadata"
          git push origin HEAD:ci/incremental-doc-pdf-autosync
