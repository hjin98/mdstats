name: Build documentation PDFs

on:
  push:
    branches:
      - docs/mlff-architecture-reset
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc and typst
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          curl -fsSL https://typst.community/typst-install/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build architecture PDF
        run: |
          test -x docs/build_architecture_pdf.sh
          docs/build_architecture_pdf.sh

      - name: Publish build provenance
        if: always()
        run: |
          mkdir -p docs/.ci
          {
            echo "# Documentation build status"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- workflow: $GITHUB_WORKFLOW"
            echo "- run: $GITHUB_RUN_ID"
            echo "- status: ${{ job.status }}"
            echo "- generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -f build/docs/mlff_training_data_architecture.pdf.sha256 ]; then
              echo
              echo "## PDF checksum"
              cat build/docs/mlff_training_data_architecture.pdf.sha256
            fi
          } > docs/.ci/latest_documentation_build.md

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/.ci/latest_documentation_build.md
          git commit -m "docs: update documentation build provenance [skip ci]" || true
          git push || true

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf-${{ github.sha }}
          path: |
            build/docs/**/*.pdf
            build/docs/**/*.sha256
          if-no-files-found: error
