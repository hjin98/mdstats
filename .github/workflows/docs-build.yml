name: Build documentation PDFs

on:
  push:
    branches:
      - docs/mlff-architecture-reset
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc and typst
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          curl -fsSL https://typst.community/typst-install/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build architecture PDF
        run: |
          test -x docs/build_architecture_pdf.sh
          docs/build_architecture_pdf.sh

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf-${{ github.sha }}
          path: |
            build/docs/**/*.pdf
            build/docs/**/*.sha256
          if-no-files-found: error
