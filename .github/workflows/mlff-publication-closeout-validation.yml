name: MLFF publication closeout validation

on:
  push:
    branches:
      - design/mlff-final-production-model-publication-mh1-integration
    paths:
      - '.github/workflows/mlff-publication-closeout-validation.yml'

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      EVIDENCE_BASE: 5a6719d9fbabf04ddad7407b2729be0d0d1f76bf
      EVIDENCE_REPORT: qualification/mlff-publication-closeout/actions-validation-report.md
    steps:
      - name: Checkout exact evidence descendant
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove product and test source match immutable evidence candidate
        run: |
          set -euo pipefail
          git diff --exit-code "$EVIDENCE_BASE" -- mdstats tests
          echo "mdstats/ and tests/ are byte-identical to evidence candidate $EVIDENCE_BASE"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install accepted CPU MLFF runtime and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'mace-torch==0.3.16' 'ase==3.29.0'
          python -m pip install -e '.[manifest]' pytest hypothesis

      - name: Record validation environment
        run: |
          mkdir -p .evidence
          python - <<'PY' | tee .evidence/environment.txt
          import importlib.metadata as md
          import platform
          names = [
              'mdstats', 'mace-torch', 'ase', 'torch', 'torch-ema', 'e3nn',
              'numpy', 'scipy', 'pytest', 'hypothesis'
          ]
          print('python=' + platform.python_version())
          for name in names:
              try:
                  print(f'{name}={md.version(name)}')
              except Exception:
                  print(f'{name}=MISSING')
          PY

      - name: Compile product and tests
        id: compile
        shell: bash
        run: |
          set +e
          python -m compileall -q mdstats tests 2>&1 | tee .evidence/compile.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Corrected closeout evidence surfaces
        id: corrected
        shell: bash
        run: |
          set +e
          python -m pytest -q -ra --tb=short             --junitxml=.evidence/corrected.xml             tests/test_mlff_p7_r11_repair_acceptance.py             tests/test_mlff_p7_r12_repair_acceptance.py             tests/test_mlff_downstream_integration_closure.py             2>&1 | tee .evidence/corrected.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mandatory focused publication and P7 suites
        id: focused
        shell: bash
        run: |
          set +e
          python -m pytest -q -ra --tb=short             --junitxml=.evidence/focused.xml             tests/test_mlff_p5_model_publication_owners.py             tests/test_mlff_p5_model_publication_acceptance.py             tests/test_mlff_p7_deployment_realization.py             tests/test_mlff_p7_product_currentness_fences.py             tests/test_mlff_mh1_publication_integration.py             2>&1 | tee .evidence/focused.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build compact execution evidence report
        env:
          COMPILE_STATUS: ${{ steps.compile.outputs.status }}
          CORRECTED_STATUS: ${{ steps.corrected.outputs.status }}
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          evidence = root / '.evidence'
          out = root / os.environ['EVIDENCE_REPORT']
          out.parent.mkdir(parents=True, exist_ok=True)

          def parse_junit(name):
              path = evidence / f'{name}.xml'
              result = {
                  'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0,
                  'time': '', 'details': [],
              }
              if not path.exists():
                  result['details'].append(('missing', 'JUnit XML was not produced.'))
                  return result
              tree = ET.parse(path)
              top = tree.getroot()
              suites = [top] if top.tag == 'testsuite' else list(top.findall('testsuite'))
              for suite in suites:
                  for key in ('tests', 'failures', 'errors', 'skipped'):
                      result[key] += int(suite.attrib.get(key, 0))
                  if suite.attrib.get('time'):
                      result['time'] = suite.attrib['time']
                  for case in suite.findall('testcase'):
                      ident = f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}"
                      for tag in ('failure', 'error', 'skipped'):
                          node = case.find(tag)
                          if node is not None:
                              text = (node.text or node.attrib.get('message') or '').strip()
                              if len(text) > 6000:
                                  text = text[:6000] + '\n...[truncated]...'
                              result['details'].append((f'{tag}: {ident}', text))
              return result

          corrected = parse_junit('corrected')
          focused = parse_junit('focused')
          environment = (evidence / 'environment.txt').read_text(encoding='utf-8')
          compile_log = (evidence / 'compile.log').read_text(encoding='utf-8') if (evidence / 'compile.log').exists() else ''

          lines = [
              '# MLFF publication closeout GitHub Actions execution evidence',
              '',
              f'- workflow evidence commit: {os.environ.get("GITHUB_SHA","")}',
              f'- immutable product/test evidence base: {os.environ["EVIDENCE_BASE"]}',
              '- source identity proof: git diff --exit-code $EVIDENCE_BASE -- mdstats tests passed before execution',
              f'- compileall exit: {os.environ["COMPILE_STATUS"]}',
              f'- corrected-surface pytest exit: {os.environ["CORRECTED_STATUS"]}',
              f'- focused-suite pytest exit: {os.environ["FOCUSED_STATUS"]}',
              '',
              '## Environment',
              '',
              '~~~text',
              environment.rstrip(),
              '~~~',
              '',
          ]

          def add_suite(title, result):
              lines.extend([
                  f'## {title}',
                  '',
                  f'- tests: {result["tests"]}',
                  f'- failures: {result["failures"]}',
                  f'- errors: {result["errors"]}',
                  f'- skipped: {result["skipped"]}',
                  f'- junit time: {result["time"] or "unreported"}',
                  '',
              ])
              if result['details']:
                  lines.append('### Non-pass details')
                  lines.append('')
                  for label, text in result['details']:
                      lines.extend([
                          f'#### {label}',
                          '',
                          '~~~text',
                          text or '(no detail text)',
                          '~~~',
                          '',
                      ])

          add_suite('Corrected closeout evidence surfaces', corrected)
          add_suite('Mandatory focused publication and P7 suites', focused)

          if compile_log.strip():
              lines.extend([
                  '## Compile output',
                  '',
                  '~~~text',
                  compile_log[-4000:].rstrip(),
                  '~~~',
                  '',
              ])

          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(out)
          PY

      - name: Publish compact evidence report
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          test "$remote_head" = "$GITHUB_SHA"
          git add -- "$EVIDENCE_REPORT"
          git commit -m "evidence: record MLFF publication closeout Actions result"
          git push origin "HEAD:$BRANCH"

      - name: Enforce validation result
        env:
          COMPILE_STATUS: ${{ steps.compile.outputs.status }}
          CORRECTED_STATUS: ${{ steps.corrected.outputs.status }}
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
        run: |
          set -euo pipefail
          test "$COMPILE_STATUS" = "0"
          test "$CORRECTED_STATUS" = "0"
          test "$FOCUSED_STATUS" = "0"
