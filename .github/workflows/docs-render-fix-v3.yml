name: Apply documentation renderer fix v3

on:
  push:
    branches:
      - ci/incremental-doc-pdf-autosync
    paths:
      - '.github/workflows/docs-render-fix-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch builder margin encoding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/build_pdfs.py')
          text = path.read_text()
          def_line = 'def _renderer_args(config: dict, source: Path, output: Path) -> list[str]:\n'
          helper = '''def _renderer_metadata(config: dict, output: Path) -> Path:
              margin = config["renderer"].get("margin")
              metadata = output.with_name(output.name + ".metadata.json")
              data = {"margin": {"x": margin, "y": margin}} if margin else {}
              metadata.write_text(json.dumps(data), encoding="utf-8")
              return metadata


          '''
          if text.count(def_line) != 1:
              raise SystemExit('renderer definition marker mismatch')
          text = text.replace(def_line, helper + def_line, 1)
          bad = '        "-V", f"papersize:{r[\'papersize\']}", "-V", f"margin:{r[\'margin\']}",\n'
          good = ('        "-V", f"papersize:{r[\'papersize\']}",\n'
                  '        "--metadata-file", str(_renderer_metadata(config, output)),\n')
          if text.count(bad) != 1:
              raise SystemExit('renderer margin line mismatch')
          path.write_text(text.replace(bad, good, 1))
          PY
          grep -n -A18 'def _renderer_metadata' docs/build_pdfs.py

      - name: Run builder regression suite
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_docs_pdf_builder

      - name: Commit renderer fix and remove diagnostics
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/docs-render-diagnostic.yml \
            .github/workflows/docs-render-arg-diagnostic.yml \
            .github/workflows/docs-render-pagevar-diagnostic.yml \
            .github/workflows/docs-render-fix.yml \
            .github/workflows/docs-render-fix-v2.yml \
            .github/workflows/docs-render-fix-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: encode Typst margin as structured metadata"
          git push origin HEAD:ci/incremental-doc-pdf-autosync
