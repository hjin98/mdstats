name: MVSEL2 hardening

on:
  push:
    branches:
      - feat/mvsel2-forward-lazy
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Bind code under test
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA"
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest psutil PyYAML
      - name: Compile touched modules
        run: |
          python -m py_compile \
            mdstats/training_data/target_multi_view_repair_v2.py \
            mdstats/training_data/target_multi_view_selector_v2_resume.py \
            mdstats/training_data/mvsel2_hardening_runtime.py \
            mdstats/training_data/campaign_cli.py \
            mdstats/training_data/_campaign_cli_core.py
      - name: Focused MVSEL2 hardening tests
        run: |
          python -m pytest -q \
            tests/test_mlff_repair2.py \
            tests/test_mlff_mvstate2.py \
            tests/test_mlff_mvmigrate2.py \
            tests/test_mlff_mvsel2_forward.py \
            tests/test_mlff_mvsel2_hardening.py

  qualification:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Bind code under test
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA"
      - name: Install qualification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest psutil PyYAML build cloudpickle torch-ema
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Adjacent v1 regressions
        run: python -m pytest -q tests/test_mlff_target_data2c_repair1.py
      - name: Full non-slow suite
        run: |
          set +e
          python -m pytest -q -m 'not slow' 2>&1 | tee full-nonslow.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > full-nonslow.exitcode
          exit "$status"
      - name: Upload full-suite diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-nonslow-diagnostic-${{ env.CANDIDATE_SHA }}
          path: |
            full-nonslow.log
            full-nonslow.exitcode
          if-no-files-found: error
          retention-days: 7
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify wheel excludes coordination artifacts
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as zf:
              names = zf.namelist()
          assert not any(name.startswith('workplans/') for name in names)
          assert not any('/workplans/' in name for name in names)
          print('wheel=', wheel[0], 'files=', len(names))
          PY
      - name: Clean wheel install and imports
        run: |
          python -m venv /tmp/mdstats-wheel
          /tmp/mdstats-wheel/bin/python -m pip install --upgrade pip
          /tmp/mdstats-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/mdstats-wheel/bin/python - <<'PY'
          import mdstats
          import mdstats.training_data.campaign_cli
          import mdstats.training_data.target_multi_view_repair_v2
          import mdstats.training_data.target_multi_view_selector_v2_resume
          import mdstats.training_data.mvsel2_hardening_runtime
          print(mdstats.__version__)
          PY
