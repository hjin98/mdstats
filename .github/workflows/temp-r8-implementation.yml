name: Temporary REV8 implementation

on:
  push:
    branches:
      - feat/mvsel2-forward-lazy

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvsel2-forward-lazy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply REV8 implementation
        shell: bash
        env:
          QUAL_B64: ''
          CHUNK_B64: ''
          TEST_B64: ''
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          def unpack(name):
              return gzip.decompress(base64.b64decode(os.environ[name])).decode()
          Path('scripts/mvsel2_bounded_qualification.py').write_text(unpack('QUAL_B64'), encoding='utf-8')
          runtime = Path('mdstats/training_data/mvsel2_hardening_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          start = text.index('def _build_repair_from_checkpoints(')
          end = text.index('def _ensure_target_multi_view_repair_v2(', start)
          text = text[:start] + unpack('CHUNK_B64') + text[end:]
          runtime.write_text(text, encoding='utf-8')
          Path('tests/test_mlff_mvsel2_rev8_qualification.py').write_text(unpack('TEST_B64'), encoding='utf-8')
          PY
      - name: Install test/build dependencies
        run: python -m pip install --upgrade pip setuptools wheel build pytest && python -m pip install -e .
      - name: Syntax and focused tests
        run: |
          python -m py_compile scripts/mvsel2_bounded_qualification.py mdstats/training_data/mvsel2_hardening_runtime.py
          pytest -q tests/test_mlff_mvsel2_hardening.py tests/test_mlff_repair2.py tests/test_mlff_mvstate2.py tests/test_mlff_mvsel2_forward.py tests/test_mlff_mvsel2_rev8_qualification.py
      - name: Build and isolated import
        run: |
          rm -rf build dist /tmp/r8-wheel-install
          python -m build --wheel --no-isolation
          mkdir -p /tmp/r8-wheel-install
          python -m pip install --no-deps --target /tmp/r8-wheel-install dist/mdstats-*.whl
          cd /tmp
          PYTHONPATH=/tmp/r8-wheel-install python - <<'PY'
          import mdstats
          assert mdstats.__version__ == '0.20.242a0'
          assert '/tmp/r8-wheel-install' in mdstats.__file__
          print(mdstats.__version__, mdstats.__file__)
          PY
      - name: Commit qualified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-r8-implementation.yml
          git add scripts/mvsel2_bounded_qualification.py mdstats/training_data/mvsel2_hardening_runtime.py tests/test_mlff_mvsel2_rev8_qualification.py
          git commit -m 'Implement REV8 lightweight autonomous MVSEL2 qualification'
          git push origin HEAD:feat/mvsel2-forward-lazy
