name: MVSEL2 baseline diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline-nonslow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1918f940debecade786b9b89c13c1bca3d787c89
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Bind baseline and apply collection-only unblockers
        run: |
          test "$(git rev-parse HEAD)" = "1918f940debecade786b9b89c13c1bca3d787c89"
          git fetch --depth=1 origin 9a3bc3b2e5413d18e997e5e1abcf7fc8e29bdb82
          git checkout FETCH_HEAD -- \
            tests/data/mesh_topology_revision_stage1_cases.json \
            tests/test_mlff_target_data2a_role_freeze.py
          test "$(git status --short | wc -l)" -eq 2
          git status --short
      - name: Install qualification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest psutil PyYAML build cloudpickle torch-ema
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full non-slow baseline
        run: |
          set +e
          python -m pytest -q -m 'not slow' 2>&1 | tee baseline-full-nonslow.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > baseline-full-nonslow.exitcode
          exit "$status"
      - name: Upload baseline diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-full-nonslow-1918f940-plus-collection-fixes
          path: |
            baseline-full-nonslow.log
            baseline-full-nonslow.exitcode
          if-no-files-found: error
          retention-days: 7
