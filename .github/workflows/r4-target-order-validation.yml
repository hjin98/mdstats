name: R4 target-order validation

on:
  push:
    branches:
      - design/mlff-d1-d2-ssdp64-axiomatic-formalization
    paths:
      - '.github/workflows/r4-target-order-validation.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    outputs:
      failure_count: ${{ steps.parse.outputs.failure_count }}
      first_name: ${{ steps.parse.outputs.first_name }}
      second_name: ${{ steps.parse.outputs.second_name }}
      first_message: ${{ steps.parse.outputs.first_message }}
      second_message: ${{ steps.parse.outputs.second_message }}
    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install accepted CPU MLFF runtime and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'mace-torch==0.3.16' 'ase==3.29.0'
          python -m pip install -e '.[manifest]' pytest
      - name: Run focused regression
        run: pytest -q tests/test_mlff_target_order_weighted_quantiles_fp64.py
      - name: Run exact real-owner suite and capture JUnit
        run: |
          set +e
          pytest -q tests/test_mlff_target_order_real_owner.py --junitxml=/tmp/r4-real-owner.xml
          echo "$?" > /tmp/r4-exit-code
          exit 0
      - id: parse
        name: Parse failure identities and messages
        run: |
          python - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          root = ET.parse('/tmp/r4-real-owner.xml').getroot()
          failed = []
          for case in root.iter('testcase'):
              node = case.find('failure')
              if node is None:
                  node = case.find('error')
              if node is not None:
                  name = f"{case.get('classname','')}::{case.get('name','')}"
                  msg = (node.get('message') or node.text or '').strip()
                  msg = re.sub(r'\s+', ' ', msg)
                  failed.append((name, msg))
          def clean(s):
              return s.replace('%','pct').replace('\n',' ')[:220]
          vals = failed + [('NONE','NONE'),('NONE','NONE')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"failure_count={len(failed)}\n")
              fh.write(f"first_name={clean(vals[0][0])}\n")
              fh.write(f"second_name={clean(vals[1][0])}\n")
              fh.write(f"first_message={clean(vals[0][1])}\n")
              fh.write(f"second_message={clean(vals[1][1])}\n")
          PY

  report:
    needs: diagnose
    name: "R4 fail=${{ needs.diagnose.outputs.failure_count }} first=${{ needs.diagnose.outputs.first_name }} msg1=${{ needs.diagnose.outputs.first_message }} second=${{ needs.diagnose.outputs.second_name }} msg2=${{ needs.diagnose.outputs.second_message }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo diagnostic-complete
