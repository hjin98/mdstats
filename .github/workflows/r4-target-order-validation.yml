      - name: test_real_owner_molecular_phase_plan_cannot_thin_target_order_families
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_molecular_phase_plan_cannot_thin_target_order_families
      - name: test_real_owner_corrupt_published_target_order_artifacts_are_not_replaced
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_corrupt_published_target_order_artifacts_are_not_replaced
      - name: test_real_owner_repair2_batch_quantities_are_bitwise_equal_to_the_scalar_oracle
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_repair2_batch_quantities_are_bitwise_equal_to_the_scalar_oracle
      - name: test_real_owner_repair2_batch_fails_closed_on_an_illegal_removal
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_repair2_batch_fails_closed_on_an_illegal_removal
      - name: test_real_owner_repair2_batch_state_arrays_are_invalidated_by_an_accepted_swap
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_repair2_batch_state_arrays_are_invalidated_by_an_accepted_swap
      - name: test_real_owner_repair2_best_relative_mask_matches_the_selector_filter
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_repair2_best_relative_mask_matches_the_selector_filter
      - name: test_real_owner_repair2_has_no_python_worker_queue_left_in_the_proposal_path
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_repair2_has_no_python_worker_queue_left_in_the_proposal_path
      - name: test_real_owner_r13_campaign_ram_budget_reaches_target_order_preparation
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_r13_campaign_ram_budget_reaches_target_order_preparation
      - name: test_real_owner_r13_covref_and_mvidx_inherit_the_finite_ram_budget
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_r13_covref_and_mvidx_inherit_the_finite_ram_budget
      - name: test_real_owner_r13_finite_budget_does_not_change_any_scientific_identity
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_r13_finite_budget_does_not_change_any_scientific_identity
      - name: test_real_owner_r13_a_small_finite_budget_reaches_queue_admission
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_r13_a_small_finite_budget_reaches_queue_admission
      - name: test_real_owner_r14_feas1_inherits_the_campaign_scope_and_owns_its_native_limits
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_r14_feas1_inherits_the_campaign_scope_and_owns_its_native_limits
      - name: test_real_owner_r14_a_small_finite_budget_reaches_feas1_queue_admission
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_r14_a_small_finite_budget_reaches_feas1_queue_admission
      - name: test_real_owner_r14_a_locally_synthesized_feas1_scope_is_still_applied
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_r14_a_locally_synthesized_feas1_scope_is_still_applied
      - name: test_real_owner_r14_feas1_products_are_identical_under_the_resource_routing
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_r14_feas1_products_are_identical_under_the_resource_routing
