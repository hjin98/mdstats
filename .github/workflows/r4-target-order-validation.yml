name: R4 target-order validation

on:
  push:
    branches:
      - design/mlff-d1-d2-ssdp64-axiomatic-formalization
    paths:
      - '.github/workflows/r4-target-order-validation.yml'

permissions:
  contents: read

jobs:
  target-order-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[manifest]' pytest
      - name: Focused weighted-quantile regression
        run: pytest -q tests/test_mlff_target_order_weighted_quantiles_fp64.py
      - name: test_real_owner_native_and_serial_ranks_match_on_wide_csr_rows
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_native_and_serial_ranks_match_on_wide_csr_rows
      - name: test_real_owner_shared_geometry_and_mvidx_match_direct_coverage
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_shared_geometry_and_mvidx_match_direct_coverage
      - name: test_real_owner_mvqual_is_independent_and_canonical
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_mvqual_is_independent_and_canonical
      - name: test_real_owner_repair_swaps_and_reconstructs_cold_continuation
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_repair_swaps_and_reconstructs_cold_continuation
      - name: test_real_owner_suffix_and_checkpoint_resume_beyond_nmax
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_suffix_and_checkpoint_resume_beyond_nmax
      - name: test_real_owner_stale_and_corrupt_checkpoints_are_rejected
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_stale_and_corrupt_checkpoints_are_rejected
      - name: test_real_owner_many_family_forward_restore_maps_constant_fds
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_many_family_forward_restore_maps_constant_fds
      - name: test_real_owner_write_failure_leaves_no_partial_accepted_artifact
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_write_failure_leaves_no_partial_accepted_artifact
      - name: test_real_owner_native_preflight_reports_real_mvidx_rows
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_native_preflight_reports_real_mvidx_rows
      - name: test_real_owner_performance_checkpoint
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_performance_checkpoint
      - name: test_real_owner_assembled_campaign_uses_prepared_order_through_production
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_assembled_campaign_uses_prepared_order_through_production
      - name: test_installed_package_native_equivalence
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_installed_package_native_equivalence
      - name: test_real_owner_prepare_build_reuse_crash_resume_and_scratch_cleanup
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_prepare_build_reuse_crash_resume_and_scratch_cleanup
      - name: test_real_owner_repair2_zero_new_coverage_swap_strictly_improves_representative_utility
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_repair2_zero_new_coverage_swap_strictly_improves_representative_utility
      - name: test_real_owner_repair2_v1_build_identity_is_not_current
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_repair2_v1_build_identity_is_not_current
      - name: test_real_owner_same_build_prepare_is_single_flight
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_same_build_prepare_is_single_flight
      - name: test_real_owner_interrupted_fence_holder_releases_and_successor_resumes
        continue-on-error: true
        run: pytest -q tests/test_mlff_target_order_real_owner.py::test_real_owner_interrupted_fence_holder_releases_and_successor_resumes
      - name: test_real_owner_required_structural_families_are_complete_or_fail_closed
        continue-on-error: true
