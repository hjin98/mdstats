name: R4 target-order validation

on:
  push:
    branches:
      - design/mlff-d1-d2-ssdp64-axiomatic-formalization
    paths:
      - '.github/workflows/r4-target-order-validation.yml'

permissions:
  contents: read

jobs:
  target-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and supported CPU MACE stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[manifest]' pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'mace-torch==0.3.16'
          python - <<'PY'
          import sys, torch, torch_ema, mace
          print("python", sys.version)
          print("torch", torch.__version__)
          print("torch_ema", getattr(torch_ema, "__version__", "unknown"))
          print("mace", getattr(mace, "__version__", "unknown"))
          PY
      - name: Focused weighted-quantile regression
        run: pytest -q tests/test_mlff_target_order_weighted_quantiles_fp64.py
      - name: Real-owner target-order integration/regression pass 1
        run: pytest -q tests/test_mlff_target_order_real_owner.py
      - name: Real-owner target-order integration/regression pass 2
        run: pytest -q tests/test_mlff_target_order_real_owner.py
