name: R4 target-order validation

on:
  push:
    branches:
      - design/mlff-d1-d2-ssdp64-axiomatic-formalization
    paths:
      - '.github/workflows/r4-target-order-validation.yml'

permissions:
  contents: read

jobs:
  target-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install accepted CPU MLFF runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'mace-torch==0.3.16' 'ase==3.29.0'
          python -m pip install -e '.[manifest]' pytest hypothesis
      - name: Record validation environment
        run: |
          python - <<'PY'
          import importlib.metadata as md, platform
          names = ['mdstats','mace-torch','ase','torch','torch-ema','e3nn','numpy','scipy','pytest','hypothesis']
          print('python=' + platform.python_version())
          for name in names:
              try:
                  print(f'{name}={md.version(name)}')
              except Exception:
                  print(f'{name}=MISSING')
          PY
      - name: Focused weighted-quantile regression
        run: pytest -q tests/test_mlff_target_order_weighted_quantiles_fp64.py
      - name: Real-owner target-order integration/regression
        run: pytest -q tests/test_mlff_target_order_real_owner.py
